<div class="ldr" [class.out]="!isVisible">

  <!-- Semi-Transparent Glass Blur Backdrop Overlay -->
  <div class="backdrop-blur-overlay" aria-hidden="true"></div>

  <!-- Ambient Glow Effects -->
  <div class="ambient-glows" aria-hidden="true">
    <div class="glow-orb g1"></div>
    <div class="glow-orb g2"></div>
  </div>

  <!-- Ultra-Premium Glass Loader Card -->
  <div class="loader-glass-card">

    <!-- Mini Brand Header Badge -->
    <div class="brand-header">
      <div class="brand-chip">
        <span class="pulse-beacon"></span>
        <span class="brand-name">SVK ENTERPRISES</span>
        <span class="live-tag">LIVE</span>
      </div>
    </div>

    <!-- Vector Ring Progress Visualizer -->
    <div class="ring-visualizer-wrap">
      <svg class="ring-svg" viewBox="0 0 100 100">
        <defs>
          <linearGradient id="loaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#6366f1" />
            <stop offset="50%" stop-color="#06b6d4" />
            <stop offset="100%" stop-color="#ec4899" />
          </linearGradient>
        </defs>

        <!-- Outer Track Ring -->
        <circle class="ring-track" cx="50" cy="50" r="45" />

        <!-- Animated Progress Gradient Stroke Arc -->
        <circle class="ring-progress" cx="50" cy="50" r="45"
                [style.strokeDashoffset]="strokeDashoffset" />
      </svg>

      <!-- Centered Percentage Display -->
      <div class="pct-badge-center">
        <span class="pct-number">{{ pct }}</span>
        <span class="pct-unit">%</span>
      </div>
    </div>

    <!-- Live Status Footer & Progress Track -->
    <div class="status-footer">
      <div class="status-row">
        <span class="status-dot"></span>
        <span class="status-label">{{ statusText }}</span>
      </div>

      <div class="linear-track">
        <div class="linear-fill" [style.width.%]="pct"></div>
      </div>
    </div>

  </div>

</div>
