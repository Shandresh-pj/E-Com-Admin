<div class="ldr" [class.out]="!isVisible">

  <!-- ═══ Background layers ════════════════════════════════════════ -->
  <div class="aurora">
    <div class="a1"></div>
    <div class="a2"></div>
    <div class="a3"></div>
  </div>
  <div class="star-field" aria-hidden="true">
    <i *ngFor="let s of stars" class="star"
      [style.top.%]="s.y"
      [style.left.%]="s.x"
      [style.width.px]="s.w"
      [style.height.px]="s.w"
      [style.opacity]="s.o"
      [style.animationDelay]="s.d + 's'"
      [style.animationDuration]="s.dur + 's'">
    </i>
  </div>

  <!-- Floating ambient orbs -->
  <div class="float-orbs" aria-hidden="true">
    <div class="fo fo1"></div>
    <div class="fo fo2"></div>
    <div class="fo fo3"></div>
  </div>

  <!-- ═══ Centre stage ══════════════════════════════════════════════ -->
  <div class="stage">

    <!-- Logo pill -->
    <div class="logo-pill" aria-label="SVK Enterprise logo">
      <div class="logo-glyph">
        <span class="lg-inner">S</span>
        <div class="lg-spin"></div>
      </div>
      <div class="logo-name">SVK Enterprises</div>
      <div class="logo-badge">LIVE</div>
    </div>

    <!-- ──── Conic ring + giant percentage ──── -->
    <div class="ring-outer-wrap">
      <!-- Decorative dashed rings -->
      <div class="dec-ring dr1"></div>
      <div class="dec-ring dr2"></div>
      <div class="dec-ring dr3"></div>
      <!-- Orbit dot on outermost ring -->
      <div class="orbit-dot"></div>

      <div class="ring-shell" [style]="ringStyle">
        <div class="ring-face">
          <div class="ring-halo"></div>
          <!-- Sweep scanline -->
          <div class="ring-sweep"></div>
          <!-- Giant % -->
          <div class="pct-block">
            <span class="pct-n">{{ pct }}</span><span class="pct-s">%</span>
          </div>
          <span class="pct-sub">Loaded</span>
        </div>
      </div>
    </div>

    <!-- ──── Typing status ──── -->
    <div class="status">
      <span class="pip"></span>
      <span class="stext">{{ statusText }}</span>
      <span class="cursor">|</span>
    </div>

    <!-- ──── Module checklist ──── -->
    <div class="modules">
      <div class="mod" *ngFor="let m of modules" [class.done]="m.done">
        <svg class="mod-icon" viewBox="0 0 16 16" fill="none">
          <circle cx="8" cy="8" r="7" [attr.stroke]="m.color" stroke-width="1.2" opacity=".4"/>
          <path *ngIf="m.done" d="M4.5 8l2.5 2.5 4-4.5" [attr.stroke]="m.color" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle *ngIf="!m.done" cx="8" cy="8" r="2" [attr.fill]="m.color" opacity=".5" class="mod-dot"/>
        </svg>
        <span class="mod-label">{{ m.name }}</span>
      </div>
    </div>

    <!-- ──── Linear progress bar ──── -->
    <div class="bar-wrap">
      <div class="bar-track">
        <div class="bar-fill" [style.width.%]="pct">
          <div class="bar-sheen"></div>
        </div>
      </div>
      <div class="bar-row">
        <span class="bar-txt">Initializing workspace…</span>
        <span class="bar-pct">{{ pct }}%</span>
      </div>
    </div>

  </div>

  <!-- Bottom glow line -->
  <div class="foot-line"></div>
</div>
