<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SVK E-Com — Enterprise ERP & Multi-Vendor OS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SVK Enterprise ERP — Multi-branch, multi-vendor management platform with AI-powered analytics.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Preconnect to reduce DNS + TLS handshake latency -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://code.iconify.design">
  <link rel="dns-prefetch" href="https://checkout.razorpay.com">

  <!--
    CRITICAL: Inline minimal CSS to paint a loading skeleton BEFORE any JS loads.
    This dramatically reduces perceived FCP and LCP on mobile.
  -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;background:#0f172a;font-family:system-ui,-apple-system,sans-serif;overflow-x:hidden}
    #app-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);z-index:9999;transition:opacity .4s ease}
    #app-loading.hide{opacity:0;pointer-events:none}
    .loader-logo{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900;color:#fff;margin-bottom:24px;box-shadow:0 0 40px rgba(99,102,241,.4);animation:pulse 2s ease-in-out infinite}
    .loader-brand{color:#fff;font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:6px}
    .loader-sub{color:#94a3b8;font-size:13px;letter-spacing:.3px;margin-bottom:32px}
    .loader-bar{width:200px;height:3px;background:#1e293b;border-radius:99px;overflow:hidden}
    .loader-fill{height:100%;width:30%;border-radius:99px;background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4);animation:load 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 40px rgba(99,102,241,.4)}50%{box-shadow:0 0 60px rgba(99,102,241,.7)}}
    @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}
    app-root:empty+*{display:none}
  </style>

  <!-- Non-blocking Google Fonts: media=print trick unblocks FCP -->
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </noscript>

  <!-- Material Icons: non-blocking async load -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Bootstrap CSS: non-blocking async load (layout not needed until JS runs) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
    media="print" onload="this.media='all'">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    media="print" onload="this.media='all'">

  <!-- Third-party scripts: defer so they never block main thread -->
  <script src="https://code.iconify.design/2/2.0.3/iconify.min.js" defer></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
</head>

<body class="mat-typography">

  <!-- Inline Loading Splash — displays instantly while Angular JS loads -->
  <div id="app-loading" aria-live="polite" aria-label="Loading application">
    <div class="loader-logo">S</div>
    <div class="loader-brand">SVK Enterprise</div>
    <div class="loader-sub">Initializing workspace…</div>
    <div class="loader-bar"><div class="loader-fill"></div></div>
  </div>

  <app-root></app-root>

  <!-- Bootstrap JS: deferred so it doesn't block paint -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous" defer></script>

  <!-- Hide the loading overlay once Angular has bootstrapped -->
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var observer = new MutationObserver(function () {
        var root = document.querySelector('app-root');
        if (root && root.children.length > 0) {
          var loader = document.getElementById('app-loading');
          if (loader) {
            loader.classList.add('hide');
            setTimeout(function () { loader.remove(); }, 500);
          }
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
      // Fallback: remove loader after 8 seconds
      setTimeout(function () {
        var loader = document.getElementById('app-loading');
        if (loader) { loader.classList.add('hide'); setTimeout(function () { loader.remove(); }, 500); }
      }, 8000);
    });
  </script>
</body>

</html>
