<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SVK E-Com — Enterprise ERP & Multi-Vendor OS</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SVK Enterprise ERP — Multi-branch, multi-vendor management platform with AI-powered analytics.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://code.iconify.design">
  <link rel="dns-prefetch" href="https://checkout.razorpay.com">

  <!--
    PRE-ANGULAR FLASH SCREEN
    Pure CSS — renders in ~50ms before any JS downloads.
    Angular's <app-loader> component replaces this as soon as it bootstraps.
  -->
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;width:100%;background:#04091a;overflow-x:hidden;font-family:system-ui,-apple-system,sans-serif}

    /* ── Pre-bootstrap skeleton (only shows before Angular loads) ── */
    #pre-boot{
      position:fixed;inset:0;z-index:88888;
      display:flex;align-items:center;justify-content:center;
      background:#04091a;
      transition:opacity .5s ease;
    }
    #pre-boot.gone{opacity:0;pointer-events:none}

    /* Animated aurora background */
    #pre-boot::before{
      content:'';position:absolute;inset:0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(99,102,241,.35) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 85% 75%, rgba(6,182,212,.28) 0%, transparent 60%),
        radial-gradient(ellipse 50% 45% at 50% 110%, rgba(139,92,246,.25) 0%, transparent 60%);
      animation:auroraShift 8s ease-in-out infinite alternate;
    }
    @keyframes auroraShift{
      from{transform:scale(1) rotate(0deg)}
      to{transform:scale(1.08) rotate(2deg)}
    }

    /* Glass mini card */
    .pre-card{
      position:relative;z-index:2;
      display:flex;flex-direction:column;align-items:center;gap:18px;
      padding:40px 52px;border-radius:28px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.1);
      backdrop-filter:blur(32px) saturate(1.8);
      -webkit-backdrop-filter:blur(32px) saturate(1.8);
      box-shadow:0 0 0 1px rgba(99,102,241,.12),0 40px 80px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.1);
      animation:preCardIn .6s cubic-bezier(.34,1.56,.64,1) both;
    }
    @keyframes preCardIn{
      from{opacity:0;transform:translateY(20px) scale(.92)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }

    /* Orbital logo */
    .pre-orbital{position:relative;width:80px;height:80px}
    .pre-ring{
      position:absolute;inset:0;border-radius:50%;
      border:1.5px solid transparent;
    }
    .pre-ring-1{
      border-top-color:#6366f1;border-right-color:rgba(99,102,241,.3);
      animation:spin 1.2s linear infinite;
    }
    .pre-ring-2{
      inset:-8px;border-bottom-color:#06b6d4;border-left-color:rgba(6,182,212,.3);
      animation:spin 2s linear infinite reverse;
    }
    @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    .pre-hex{
      position:absolute;inset:10px;border-radius:14px;
      background:linear-gradient(135deg,#6366f1,#8b5cf6,#06b6d4);
      display:flex;align-items:center;justify-content:center;
      font-size:26px;font-weight:900;color:#fff;
      box-shadow:0 0 24px rgba(99,102,241,.5);
      animation:hexPulse 2s ease-in-out infinite;
    }
    @keyframes hexPulse{
      0%,100%{box-shadow:0 0 24px rgba(99,102,241,.5)}
      50%{box-shadow:0 0 40px rgba(99,102,241,.8),0 0 60px rgba(6,182,212,.3)}
    }

    .pre-brand{
      font-size:20px;font-weight:800;
      background:linear-gradient(135deg,#fff,#a5b4fc);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .pre-sub{font-size:11px;color:rgba(148,163,184,.6);letter-spacing:.6px;text-transform:uppercase}

    /* Shimmer bar */
    .pre-bar{width:200px;height:3px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
    .pre-fill{
      height:100%;width:40%;border-radius:99px;
      background:linear-gradient(90deg,#6366f1,#8b5cf6,#06b6d4,#6366f1);
      background-size:200% 100%;
      animation:barShimmer 1.6s linear infinite;
    }
    @keyframes barShimmer{from{background-position:200% 0}to{background-position:-200% 0}}
  </style>

  <!-- Async Google Fonts (non-blocking) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons&display=swap"
    rel="stylesheet" media="print" onload="this.media='all'">

  <!-- Bootstrap CSS (async) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
    media="print" onload="this.media='all'">
  <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    media="print" onload="this.media='all'">

  <script src="https://code.iconify.design/2/2.0.3/iconify.min.js" defer></script>
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
</head>

<body class="mat-typography">

  <!-- Pre-Angular CSS-only loader (disappears the moment Angular mounts) -->
  <div id="pre-boot" aria-label="Loading application" role="status">
    <div class="pre-card">
      <div class="pre-orbital">
        <div class="pre-ring pre-ring-2"></div>
        <div class="pre-ring pre-ring-1"></div>
        <div class="pre-hex">S</div>
      </div>
      <div class="pre-brand">SVK Enterprise</div>
      <div class="pre-sub">Workspace initializing</div>
      <div class="pre-bar"><div class="pre-fill"></div></div>
    </div>
  </div>

  <!-- Angular mounts here — <app-loader> inside AppComponent takes over -->
  <app-root></app-root>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous" defer></script>

  <!-- Hide the pre-boot screen as soon as Angular's first child mounts -->
  <script>
    var _ob = new MutationObserver(function() {
      var r = document.querySelector('app-root');
      if (r && r.children.length > 0) {
        var el = document.getElementById('pre-boot');
        if (el) { el.classList.add('gone'); setTimeout(function(){ el && el.remove(); }, 550); }
        _ob.disconnect();
      }
    });
    _ob.observe(document.body, { childList: true, subtree: true });
    setTimeout(function() {
      var el = document.getElementById('pre-boot');
      if (el) { el.classList.add('gone'); setTimeout(function(){ el && el.remove(); }, 550); }
    }, 10000);
  </script>
</body>

</html>
